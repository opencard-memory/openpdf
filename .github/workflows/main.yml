name: Build C++ EXE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Build Batch
      run: |
        .\build_release.bat

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenPDFOffice-Release
        path: |
          out/build/x64-Release/
          build/
          bin/
